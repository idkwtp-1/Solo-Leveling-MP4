<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shadow Player // Initializing</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0b0e14;
      color: #00d2ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 210, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 210, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }
    .glow-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      z-index: 10;
    }
    .badge {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(0, 210, 255, 0.7);
      border: 1px solid rgba(0, 210, 255, 0.3);
      padding: 4px 12px;
      background: rgba(0, 210, 255, 0.05);
      border-radius: 2px;
    }
    .title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #f0f4fc;
      text-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
    }
    .ring {
      width: 64px;
      height: 64px;
      border: 2px solid rgba(0, 210, 255, 0.15);
      border-top: 2px solid #00d2ff;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      box-shadow: 0 0 16px rgba(0, 210, 255, 0.3);
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .status {
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: rgba(240, 244, 252, 0.6);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow-container">
    <div class="badge">SYSTEM INITIALIZATION</div>
    <div class="ring"></div>
    <div class="title">SHADOW PLAYER</div>
    <div class="status">AWAKENING SYSTEM CORE...</div>
  </div>
</body>
</html>
